[project]
name = "fiyat-motoru"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1", "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0,<2.1", "pydantic>=2.7", "python-multipart>=0.0.9", "defusedxml>=0.7", "fpdf2>=2.8"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx2>=2.16"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["fiyat_motoru*", "backend*"]
